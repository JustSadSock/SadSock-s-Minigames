<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14110e">
  <title data-i18n="dodgeRain"></title>
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/game.css">
  <style>
    #gameCanvas{
      background:var(--bg2);
      border:4px solid var(--pastel-peach);
      image-rendering:pixelated;
      box-shadow:0 10px 20px rgba(0,0,0,0.2);
      width:min(70svh,96vw);
      height:auto;
      aspect-ratio:3/4;
    }
    #score{margin:0;font-size:14px;}

    .toast{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      background:var(--pastel-pink);
      border:1px solid var(--accent);
      border-radius:8px;
      padding:12px 16px;
      font-size:14px;
      color:var(--ink);
    }
  </style>
</head>
  <body class="theme-blue">
    <canvas class="icon" data-icon="rain" aria-hidden="true"></canvas>
    <h1 data-i18n="dodgeRain"></h1>
  <div class="play">
    <div class="hud">
      <div id="score" class="counter">0</div>
      <button id="scoresBtn" class="pill" data-i18n-aria-label="records">🏆</button>
      <div id="status" class="counter" style="visibility:hidden"></div>
    </div>
    <button id="settingsBtn" class="pill settings-btn" data-i18n-aria-label="settings">⚙️</button>
    <canvas id="gameCanvas" tabindex="0" data-i18n-aria-label="gameField"></canvas>
    <div id="toast" class="toast"></div>
    <div id="pad" class="pad pad-center">
      <div class="dpad" aria-hidden="true">
        <div class="k" data-dir="up" style="grid-area:up"><canvas data-icon="arrow-up"></canvas></div>
        <div class="k" data-dir="left" style="grid-area:left"><canvas data-icon="arrow-left"></canvas></div>
        <div class="k" style="grid-area:mid;opacity:.35"></div>
        <div class="k" data-dir="right" style="grid-area:right"><canvas data-icon="arrow-right"></canvas></div>
        <div class="k" data-dir="down" style="grid-area:down"><canvas data-icon="arrow-down"></canvas></div>
      </div>
      <button class="btn" id="startBtn" data-i18n="start" data-i18n-aria-label="start"></button>
    </div>
  </div>
    <script type="module" src="./src/games/dodge-rain/index.js"></script>
  </body>
</html>
